# =============================================================================
# ExtraHand Intelligence Platform: Production Multi-Container Compose
#
# Backend  : port 5074 (https://backend.intelligence.extrahand.in)
# Frontend : port 3074 (https://intelligence.extrahand.in)
# Database : Remote PostgreSQL (200.141.7.100:5437/Extrahand) configured in backend/.env
# Storage  : Azure Blob Storage (extrahandautomations) configured in backend/.env
#
# Quick commands:
#   docker compose build
#   docker compose up -d
#   docker compose logs -f
# =============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: extrahand-backend:latest
    container_name: extrahand-backend
    restart: unless-stopped
    # Settings: on Dokploy, paste them into the app's Environment tab (Dokploy saves them as ./.env next to this
    # file). Locally, backend/.env is used. Whichever exists is read; neither is in git.
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      PORT: "5074"
      PUBLIC_BASE_URL: "https://backend.intelligence.extrahand.in"
      TASK_SEEDING_LINK_BASE: "https://backend.intelligence.extrahand.in"
      TRUST_PROXY_HEADERS: "true"
    ports:
      - "127.0.0.1:5074:5074"   # only nginx on this server reaches it (Docker would bypass the firewall otherwise)
    volumes:
      - voiceaudio:/audio
      - appdata:/data
    networks:
      - extrahand-net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # empty = the dashboard calls /api on its own address, and its nginx passes it to the backend container
        # (works on any domain, needs no CORS; the login cookie stays first-party)
        VITE_API_BASE_URL: ""
    image: extrahand-frontend:latest
    container_name: extrahand-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3074:3074"     # only nginx on this server reaches it
    depends_on:
      - backend
    networks:
      - extrahand-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  extrahand-net:
    driver: bridge

volumes:
  voiceaudio:
  appdata:
