# =============================================================================
# ExtraHand Intelligence Platform - Production Nginx Reverse Proxy
#
# Frontend : https://intelligence.extrahand.in          -> 127.0.0.1:3074
# Backend  : https://backend.intelligence.extrahand.in  -> 127.0.0.1:5074
#
# Installation on Ubuntu / Debian VPS:
#   1. Copy this file to /etc/nginx/sites-available/intelligence.conf
#   2. ln -s /etc/nginx/sites-available/intelligence.conf /etc/nginx/sites-enabled/
#   3. Obtain SSL certificates:
#        certbot --nginx -d intelligence.extrahand.in -d backend.intelligence.extrahand.in
#   4. nginx -t && systemctl reload nginx
# =============================================================================

# Rate limiting zones (protects login from brute-force & webhooks from floods)
limit_req_zone $binary_remote_addr zone=ex_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ex_hooks:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ex_pricing:10m rate=30r/s;

# -----------------------------------------------------------------------------
# 1. FRONTEND: intelligence.extrahand.in (Port 3074)
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name intelligence.extrahand.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name intelligence.extrahand.in;

    ssl_certificate     /etc/letsencrypt/live/intelligence.extrahand.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intelligence.extrahand.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Direct proxy to Frontend React Container on 3074
    location / {
        proxy_pass http://127.0.0.1:3074;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # API fallback proxy (allows frontend to call relative /api routes seamlessly)
    location /api/ {
        proxy_pass http://127.0.0.1:5074;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# -----------------------------------------------------------------------------
# 2. BACKEND API: backend.intelligence.extrahand.in (Port 5074)
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name backend.intelligence.extrahand.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name backend.intelligence.extrahand.in;

    ssl_certificate     /etc/letsencrypt/live/backend.intelligence.extrahand.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.intelligence.extrahand.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Image upload capacity (WhatsApp campaign flyers & festival posters)
    client_max_body_size 25m;

    # Common proxy headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Block public access to swagger / openapi in production
    location ~ ^/(docs|redoc|openapi\.json) {
        return 404;
    }

    # Brute-force protected login
    location = /api/auth/login {
        limit_req zone=ex_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:5074;
    }

    # Webhooks (Meta WhatsApp, Vobiz Telephony, LiveKit Voice Agent)
    location ~ ^/api/(telephony|handoff|whatsapp/webhook) {
        limit_req zone=ex_hooks burst=50 nodelay;
        proxy_pass http://127.0.0.1:5074;
        proxy_read_timeout 60s;
    }

    # Public Pricing API (protected by X-API-Key and rate-limited)
    location /api/pricing/v1/ {
        limit_req zone=ex_pricing burst=50 nodelay;
        proxy_pass http://127.0.0.1:5074;
    }

    # All other API routes
    location / {
        proxy_pass http://127.0.0.1:5074;
        proxy_read_timeout 120s;
    }
}
